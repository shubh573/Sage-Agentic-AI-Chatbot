<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Sage</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        /* Dark theme (default) — classic ChatGPT-style gray/green palette */
        :root {
            --bg: #343541;
            --bg-elevated: #40414f;
            --sidebar: #202123;
            --surface: #444654;
            --surface-hover: #3f4046;
            --border: #4d4d4f;
            --border-soft: #2a2b32;
            --text: #ececf1;
            --text-muted: #c5c5d2;
            --text-faint: #8e8ea0;
            --accent: #10a37f;
            --accent-strong: #19c37d;
            --accent-dim: #0d8a6c;
            --user-bubble: #343541;
            --danger: #ef4146;
            --avatar-user-bg: #5b5c6a;
            --avatar-user-text: #ececf1;
            --avatar-bot-bg: #10a37f;
            --avatar-bot-text: #ffffff;
            --icon-on-accent: #ffffff;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        /* Light theme override */
        [data-theme="light"] {
            --bg: #ffffff;
            --bg-elevated: #f7f7f8;
            --sidebar: #f9f9f9;
            --surface: #f7f7f8;
            --surface-hover: #ececec;
            --border: #e5e5e5;
            --border-soft: #ececec;
            --text: #0d0d0d;
            --text-muted: #6e6e80;
            --text-faint: #8e8ea0;
            --accent: #10a37f;
            --accent-strong: #0d8a6c;
            --accent-dim: #d1f0e6;
            --user-bubble: #f4f4f4;
            --danger: #ef4146;
            --avatar-user-bg: #ececec;
            --avatar-user-text: #0d0d0d;
            --avatar-bot-bg: #10a37f;
            --avatar-bot-text: #ffffff;
            --icon-on-accent: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
            transition: background 0.2s ease, color 0.2s ease;
        }

        ::selection {
            background: var(--accent-dim);
            color: var(--text);
        }

        /* Scrollbars */
        #conversationList::-webkit-scrollbar,
        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        #conversationList::-webkit-scrollbar-thumb,
        .chat-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }

        #conversationList::-webkit-scrollbar-track,
        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar {
            width: 270px;
            background: var(--sidebar);
            border-right: 1px solid var(--border-soft);
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 8px 18px;
            margin-bottom: 4px;
        }

        .brand-mark {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: linear-gradient(155deg, var(--accent-strong), var(--accent-dim));
            flex-shrink: 0;
            position: relative;
        }

        .brand-mark::after {
            content: "";
            position: absolute;
            inset: 6px;
            border-radius: 50%;
            border: 1.5px solid rgba(0, 0, 0, 0.35);
            border-right-color: transparent;
            border-bottom-color: transparent;
            transform: rotate(45deg);
        }

        .brand-name {
            font-family: 'Fraunces', serif;
            font-size: 19px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .new-chat {
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text);
            padding: 11px 14px;
            border-radius: var(--radius-md);
            text-align: left;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
            font-weight: 500;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .new-chat:hover {
            background: var(--surface-hover);
            border-color: var(--accent-dim);
        }

        .history-title {
            color: var(--text-faint);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin: 6px 0 8px;
            padding-left: 6px;
        }

        #conversationList {
            overflow-y: auto;
            flex: 1;
            padding-right: 2px;
        }

        .history-item {
            padding: 0;
            border-radius: var(--radius-sm);
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s ease, color 0.15s ease;
            display: flex;
            align-items: center;
            min-width: 0;
        }

        .history-item:hover {
            background: var(--surface);
            color: var(--text);
        }

        .history-item.active {
            background: var(--surface);
            color: var(--accent-strong);
        }

        .history-title-text {
            flex: 1;
            min-width: 0;
            padding: 10px 8px 10px 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .delete-chat-btn {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: var(--text-faint);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            margin-right: 4px;
            opacity: 0;
            transition:
                background 0.15s ease,
                color 0.15s ease,
                opacity 0.15s ease;
        }

        .history-item:hover .delete-chat-btn {
            opacity: 1;
        }

        .delete-chat-btn:hover {
            background: rgba(217, 119, 87, 0.15);
            color: var(--danger);
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.2s ease;
        }

        .topbar {
            height: 58px;
            border-bottom: 1px solid var(--border-soft);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 26px;
            font-size: 15px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .status {
            font-size: 12.5px;
            color: var(--text-muted);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .status::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.18);
        }

        .theme-toggle {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            color: var(--text);
            cursor: pointer;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .theme-toggle:hover {
            background: var(--surface-hover);
            border-color: var(--accent-dim);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 160px;
        }

        .welcome {
            max-width: 720px;
            margin: 100px auto 0;
            text-align: center;
        }

        .welcome h1 {
            font-family: 'Fraunces', serif;
            font-size: 36px;
            margin-bottom: 12px;
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        .welcome p {
            color: var(--text-muted);
            font-size: 15.5px;
            line-height: 1.6;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 720px;
            margin: 32px auto 0;
        }

        .card {
            border: 1px solid var(--border);
            background: var(--bg-elevated);
            border-radius: var(--radius-md);
            padding: 16px;
            color: var(--text-muted);
            cursor: pointer;
            text-align: left;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: background 0.15s ease, border-color 0.15s ease;
        }

        .card:hover {
            background: var(--surface-hover);
            border-color: var(--accent-dim);
            color: var(--text);
        }

        .card-icon {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: var(--accent-dim);
            color: var(--accent-strong);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
        }

        .message {
            max-width: 800px;
            margin: 0 auto 28px;
            display: flex;
            gap: 12px;
            line-height: 1.65;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message.user .avatar {
            order: 2;
        }

        .message.user .message-content {
            order: 1;
            background: var(--user-bubble);
            border: 1px solid var(--border);
            border-radius: 18px 18px 4px 18px;
            padding: 12px 16px;
            max-width: 70%;
        }

        .message.assistant .message-content {
            background: transparent;
            padding: 0;
            max-width: 75%;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
        }

        .user-avatar {
            background: var(--avatar-user-bg);
            color: var(--avatar-user-text);
        }

        .bot-avatar {
            background: var(--avatar-bot-bg);
            color: var(--avatar-bot-text);
        }

        .message-content {
            color: var(--text);
            font-size: 15.5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .tool-progress {
            max-width: 800px;
            margin: 0 auto 14px;
            display: flex;
            justify-content: flex-start;
        }

        .tool-progress-box {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 13px;
            border-radius: 12px;
            font-size: 13px;
        }

        .tool-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .tool-check {
            color: var(--accent);
            font-weight: bold;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 270px;
            right: 0;
            background: linear-gradient(to top, var(--bg) 78%, transparent);
            padding: 22px 20px 24px;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: flex-end;
            padding: 10px 10px 10px 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            transition: border-color 0.15s ease, background 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-dim);
        }

        .attach-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 18px;
            margin-right: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .attach-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            color: var(--text);
            font-family: inherit;
            font-size: 15.5px;
            min-height: 30px;
            max-height: 170px;
            line-height: 1.5;
            padding: 8px 7px;
        }

        textarea::placeholder {
            color: var(--text-faint);
        }

        .model-select {
            height: 38px;
            max-width: 140px;
            background: var(--bg-elevated);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 8px;
            margin-left: 6px;
            outline: none;
            font-size: 12.5px;
            font-family: inherit;
            cursor: pointer;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .model-select:hover {
            background: var(--surface-hover);
        }

        .model-select option {
            background: var(--bg-elevated);
            color: var(--text);
        }

        .mic-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: none;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 17px;
            margin-left: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .mic-btn:hover {
            background: var(--surface-hover);
            color: var(--text);
        }

        .mic-btn.recording {
            background: var(--danger);
            color: var(--icon-on-accent);
            animation: pulseMic 1.2s infinite;
        }

        @keyframes pulseMic {
            0% {
                box-shadow: 0 0 0 0 rgba(239, 65, 70, 0.45);
            }

            70% {
                box-shadow: 0 0 0 8px rgba(239, 65, 70, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(239, 65, 70, 0);
            }
        }

        .send-btn {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-sm);
            border: none;
            background: var(--accent);
            color: var(--icon-on-accent);
            cursor: pointer;
            font-size: 17px;
            margin-left: 6px;
            flex-shrink: 0;
            transition: background 0.15s ease;
        }

        .send-btn:hover {
            background: var(--accent-strong);
        }

        .send-btn:disabled {
            background: var(--border);
            color: var(--text-faint);
            cursor: not-allowed;
        }

        .notice {
            color: var(--text-faint);
            font-size: 12px;
            max-width: 800px;
            margin: 10px auto 0;
            text-align: center;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

            .cards {
                grid-template-columns: 1fr;
            }

            .message.user .message-content,
            .message.assistant .message-content {
                max-width: 82%;
            }

            .model-select {
                max-width: 95px;
                font-size: 11px;
                padding: 0 6px;
            }

            .mic-btn {
                width: 36px;
                height: 36px;
                font-size: 16px;
                margin-left: 6px;
            }
        }
    </style>
</head>

<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-mark"></div>
        <div class="brand-name">Sage</div>
    </div>

    <button class="new-chat" onclick="newChat()">+ New chat</button>

    <div class="history-title">Recent Chats</div>
    <div id="conversationList"></div>
</aside>

<main class="main">
    <div class="topbar">
        <div>AI Chatbot</div>
        <div class="topbar-right">
            <div class="status" id="status">Ready</div>
            <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
            <h1>How can I help you today?</h1>
            <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
        </div>

        <div class="cards" id="cards">
            <div class="card" onclick="usePrompt('Search the web for latest AI agent news.')">
                <div class="card-icon">🔎</div>
                Search latest web info
            </div>

            <div class="card" onclick="usePrompt('Summarize the document I uploaded.')">
                <div class="card-icon">📄</div>
                Summarize uploaded document
            </div>

            <div class="card" onclick="usePrompt('Remember that.')">
                <div class="card-icon">🧠</div>
                Save something to memory
            </div>

            <div class="card" onclick="usePrompt('Calculate 125 * 48 / 6')">
                <div class="card-icon">🧮</div>
                Use calculator tool
            </div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">

            <input
                type="file"
                id="fileInput"
                style="display: none;"
                accept=".pdf,.docx,.txt,.md,.py,.csv"
                onchange="uploadFile()"
            >

            <button class="attach-btn" onclick="openFilePicker()" title="Upload document">
                📎
            </button>

            <textarea
                id="messageInput"
                placeholder="Ask anything..."
                rows="1"
                oninput="autoResize(this)"
                onkeydown="handleKeyDown(event)"
            ></textarea>


            <select id="modelSelect" class="model-select" title="Select model">

                <optgroup label="Google Gemini">
                    <option value="google:gemini-3.8-flash">
                        Gemini 3.8 Flash
                    </option>

                    <option value="google:gemini-3.5-flash">
                        Gemini 3.5 Flash
                    </option>

                    <option value="google:gemini-3.5-flash-lite">
                        Gemini 3.5 Flash Lite
                    </option>
                </optgroup>

                <optgroup label="OpenAI">
                    <option value="openai:gpt-5.4">
                        GPT-5.4
                    </option>

                    <option value="openai:gpt-5-mini">
                        GPT-5 Mini
                    </option>

                    <option value="openai:gpt-5-nano">
                        GPT-5 Nano
                    </option>
                </optgroup>

                <optgroup label="Anthropic">
                    <option value="anthropic:claude-sonnet-4-5">
                        Claude Sonnet
                    </option>

                    <option value="anthropic:claude-opus-4-1">
                        Claude Opus
                    </option>
                </optgroup>

                <optgroup label="Groq">
                    <option value="groq:llama-3.3-70b-versatile">
                        Llama 3.3 70B
                    </option>

                    <option value="groq:llama-4-scout-17b-16e-instruct">
                        Llama 4 Scout
                    </option>
                </optgroup>

            </select>



            <button class="mic-btn" id="micBtn" onclick="toggleDictation()" title="Dictate">
                🎙️
            </button>

            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➜</button>
        </div>

        <div class="notice" id="noticeText">
            Sage can make mistakes. Check important info.
        </div>
    </div>
</main>

<script>
    const chatContainer = document.getElementById("chatContainer");
    const messageInput = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("status");
    const conversationList = document.getElementById("conversationList");
    const modelSelect = document.getElementById("modelSelect");
    const noticeText = document.getElementById("noticeText");
    const micBtn = document.getElementById("micBtn");
    const themeToggle = document.getElementById("themeToggle");
    const htmlRoot = document.documentElement;

    // ---- Theme (light/dark) ----
    function applyTheme(theme) {
        htmlRoot.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);

        if (themeToggle) {
            themeToggle.textContent = theme === "dark" ? "☀️" : "🌙";
            themeToggle.title = theme === "dark"
                ? "Switch to light mode"
                : "Switch to dark mode";
        }
    }

    function toggleTheme() {
        const current = htmlRoot.getAttribute("data-theme") || "dark";
        applyTheme(current === "dark" ? "light" : "dark");
    }

    applyTheme(localStorage.getItem("theme") || "dark");

    let threadId = crypto.randomUUID();
    localStorage.setItem("thread_id", threadId);

    const savedModel = localStorage.getItem("selected_model");

    if (savedModel && modelSelect) {
        modelSelect.value = savedModel;
    }

    if (modelSelect) {
        modelSelect.addEventListener("change", () => {
            localStorage.setItem("selected_model", modelSelect.value);

            if (noticeText) {
                noticeText.textContent = `Selected model: ${modelSelect.value}`;
            }
        });
    }

    let recognition = null;
    let isDictating = false;

    function setupSpeechRecognition() {
        const SpeechRecognition =
            window.SpeechRecognition || window.webkitSpeechRecognition;

        if (!SpeechRecognition) {
            return null;
        }

        const speechRecognition = new SpeechRecognition();

        speechRecognition.lang = "en-US";
        speechRecognition.continuous = true;
        speechRecognition.interimResults = true;

        speechRecognition.onstart = () => {
            isDictating = true;

            if (micBtn) {
                micBtn.classList.add("recording");
                micBtn.textContent = "⏹️";
            }

            statusText.textContent = "Listening...";
        };

        speechRecognition.onresult = (event) => {
            let finalTranscript = "";
            let interimTranscript = "";

            for (let i = event.resultIndex; i < event.results.length; i++) {
                const transcript = event.results[i][0].transcript;

                if (event.results[i].isFinal) {
                    finalTranscript += transcript + " ";
                } else {
                    interimTranscript += transcript;
                }
            }

            if (finalTranscript) {
                const currentText = messageInput.value.trim();

                messageInput.value = currentText
                    ? currentText + " " + finalTranscript.trim()
                    : finalTranscript.trim();

                autoResize(messageInput);
            }

            if (interimTranscript && noticeText) {
                noticeText.textContent = "Listening: " + interimTranscript;
            }
        };

        speechRecognition.onerror = (event) => {
            console.error("Speech recognition error:", event.error);

            if (event.error === "not-allowed") {
                alert("Microphone permission denied. Please allow microphone access.");
            }

            stopDictation();
        };

        speechRecognition.onend = () => {
            if (isDictating) {
                try {
                    speechRecognition.start();
                } catch (error) {
                    stopDictation();
                }
            }
        };

        return speechRecognition;
    }

    function toggleDictation() {
        if (!recognition) {
            recognition = setupSpeechRecognition();
        }

        if (!recognition) {
            alert("Speech recognition is not supported in this browser. Please use Chrome or Edge.");
            return;
        }

        if (isDictating) {
            stopDictation();
        } else {
            startDictation();
        }
    }

    function startDictation() {
        try {
            recognition.start();
        } catch (error) {
            console.error("Could not start dictation:", error);
        }
    }

    function stopDictation() {
        isDictating = false;

        if (recognition) {
            try {
                recognition.stop();
            } catch (error) {
                console.error("Could not stop dictation:", error);
            }
        }

        if (micBtn) {
            micBtn.classList.remove("recording");
            micBtn.textContent = "🎙️";
        }

        statusText.textContent = "Ready";

        if (noticeText) {
            noticeText.textContent = "Sage can make mistakes. Check important info.";
        }

        messageInput.focus();
    }

    function autoResize(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
    }

    function hideWelcome() {
        const welcome = document.getElementById("welcome");
        const cards = document.getElementById("cards");

        if (welcome) welcome.style.display = "none";
        if (cards) cards.style.display = "none";
    }

    function handleKeyDown(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    function usePrompt(text) {
        messageInput.value = text;
        autoResize(messageInput);
        messageInput.focus();
    }

    function openFilePicker() {
        document.getElementById("fileInput").click();
    }

    function addMessage(role, content = "") {
        hideWelcome();

        const messageDiv = document.createElement("div");
        messageDiv.className = role === "user"
            ? "message user"
            : "message assistant";

        const avatar = document.createElement("div");
        avatar.className = role === "user"
            ? "avatar user-avatar"
            : "avatar bot-avatar";

        avatar.textContent = role === "user" ? "U" : "AI";

        const messageContent = document.createElement("div");
        messageContent.className = "message-content";
        messageContent.textContent = content;

        messageDiv.appendChild(avatar);
        messageDiv.appendChild(messageContent);

        chatContainer.appendChild(messageDiv);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return messageContent;
    }

    function detectLikelyTool(message) {
        const text = message.toLowerCase();

        const mathPattern = /(\d+\s*[\+\-\*\/]\s*\d+)|calculate|calculation|math|solve/;
        const ragPattern = /document|pdf|file|uploaded|summarize|summary|according to|based on/;
        const memorySavePattern = /remember that|save this|store this|keep in memory|memorize/;
        const memoryRecallPattern = /what do you remember|recall|my memory|remember about me/;

        const weatherPattern = /weather|temperature|rain|raining|forecast|humidity|wind|windy|snow|snowing|storm|thunderstorm|hot|cold|climate/;

        const stockPattern = /\b(stock|share price|stock price|share price|ticker|equity|market price)\b/i;

        const webSearchPattern =
            /latest|current|today|now|recent|news|search web|web search|internet|online|price|version|update|2025|2026|who is|what is happening|trending|release|new model|current ceo|latest version/;

        if (memorySavePattern.test(text)) {
            return "Memory Save";
        }

        if (memoryRecallPattern.test(text)) {
            return "Memory Recall";
        }

        if (ragPattern.test(text)) {
            return "Document Search";
        }

        if (weatherPattern.test(text)) {
            const forecastPattern =
                /tomorrow|forecast|next few days|next week|future|will it rain|will it snow|upcoming/;

            if (forecastPattern.test(text)) {
                return "Weather Forecast";
            }
            return "Weather";
        }

        if (stockPattern.test(text)) {
            return "Stock Price";
        }

        if (webSearchPattern.test(text)) {
            return "Web Search";
        }

        if (mathPattern.test(text)) {
            return "Calculator";
        }

        return null;
    }

    function addToolProgress(toolName) {
        const wrapper = document.createElement("div");
        wrapper.className = "tool-progress";

        const box = document.createElement("div");
        box.className = "tool-progress-box";

        const icon = document.createElement("span");
        icon.className = "tool-spinner";

        const text = document.createElement("span");
        text.textContent = `Using ${toolName}...`;

        box.appendChild(icon);
        box.appendChild(text);
        wrapper.appendChild(box);

        chatContainer.appendChild(wrapper);
        chatContainer.scrollTop = chatContainer.scrollHeight;

        return {
            wrapper,
            icon,
            text
        };
    }

    function completeToolProgress(toolProgress, toolName) {
        if (!toolProgress) return;

        toolProgress.icon.className = "tool-check";
        toolProgress.icon.textContent = "✓";
        toolProgress.text.textContent = `${toolName} completed`;
    }

    async function loadConversations() {
    try {
        const response = await fetch("/conversations");
        const data = await response.json();

        conversationList.innerHTML = "";

        if (!data.conversations || data.conversations.length === 0) {
            conversationList.innerHTML = `
                <div class="history-item">
                    <div class="history-title-text">
                        No chats yet
                    </div>
                </div>
            `;
            return;
        }

        data.conversations.forEach(conv => {

            const item = document.createElement("div");
            item.className = "history-item";

            if (conv.thread_id === threadId) {
                item.classList.add("active");
            }

            // ---------------------------------------------
            // Chat title
            // ---------------------------------------------

            const title = document.createElement("div");
            title.className = "history-title-text";
            title.textContent = conv.title || "New Chat";

            title.onclick = () => {
                loadConversation(conv.thread_id);
            };


            // ---------------------------------------------
            // Delete button
            // ---------------------------------------------

            const deleteButton = document.createElement("button");

            deleteButton.className = "delete-chat-btn";
            deleteButton.innerHTML = "🗑";
            deleteButton.title = "Delete chat";

            deleteButton.onclick = (event) => {
                event.stopPropagation();

                deleteChat(
                    conv.thread_id,
                    conv.title || "New Chat"
                );
            };


            // ---------------------------------------------
            // Add elements
            // ---------------------------------------------

            item.appendChild(title);
            item.appendChild(deleteButton);

            conversationList.appendChild(item);
        });

    } catch (error) {
        console.error(
            "Failed to load conversations:",
            error
        );
    }
}


    async function deleteChat(selectedThreadId, chatTitle) {

    const confirmed = confirm(
        `Delete "${chatTitle}"?\n\nThis will permanently delete this conversation.`
    );

    if (!confirmed) {
        return;
    }

    try {

        statusText.textContent = "Deleting chat...";

        const response = await fetch(
            `/conversations/${encodeURIComponent(selectedThreadId)}`,
            {
                method: "DELETE"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.message || "Failed to delete chat."
            );
        }


        // ---------------------------------------------
        // If deleting the currently open conversation
        // ---------------------------------------------

        if (selectedThreadId === threadId) {

            threadId = crypto.randomUUID();

            localStorage.setItem(
                "thread_id",
                threadId
            );

            renderWelcome();
        }


        // ---------------------------------------------
        // Refresh sidebar
        // ---------------------------------------------

        await loadConversations();

        statusText.textContent = "Ready";

        messageInput.focus();

    } catch (error) {

        console.error(
            "Delete chat error:",
            error
        );

        alert(
            "Could not delete chat: " +
            error.message
        );

        statusText.textContent = "Ready";
    }
}


    async function loadConversation(selectedThreadId) {
        threadId = selectedThreadId;
        localStorage.setItem("thread_id", threadId);

        try {
            const response = await fetch(`/history/${threadId}`);
            const data = await response.json();

            chatContainer.innerHTML = "";

            if (!data.messages || data.messages.length === 0) {
                renderWelcome();
                await loadConversations();
                return;
            }

            data.messages.forEach(msg => {
                addMessage(
                    msg.role === "user" ? "user" : "assistant",
                    msg.content
                );
            });

            await loadConversations();

        } catch (error) {
            console.error("Failed to load conversation:", error);
        }
    }

    function renderWelcome() {
        chatContainer.innerHTML = `
            <div class="welcome" id="welcome">
                <h1>How can I help you today?</h1>
                <p>Ask questions, upload documents, use tools, search the web, and chat with memory.</p>
            </div>

            <div class="cards" id="cards">
                <div class="card" onclick="usePrompt('Search the web for latest AI agent news.')">
                    <div class="card-icon">🔎</div>
                    Search latest web info
                </div>

                <div class="card" onclick="usePrompt('Summarize the document I uploaded.')">
                    <div class="card-icon">📄</div>
                    Summarize uploaded document
                </div>

                <div class="card" onclick="usePrompt('Remember that.')">
                    <div class="card-icon">🧠</div>
                    Save something to memory
                </div>

                <div class="card" onclick="usePrompt('Calculate 125 * 48 / 6')">
                    <div class="card-icon">🧮</div>
                    Use calculator tool
                </div>
            </div>
        `;
    }

    function parseSSEPart(part) {
        const lines = part
            .split(/\r?\n/)
            .filter(line => line.trim().startsWith("data:"));

        if (lines.length === 0) {
            return null;
        }

        const jsonText = lines
            .map(line => line.replace(/^data:\s*/, ""))
            .join("\n")
            .trim();

        if (!jsonText || jsonText === "[DONE]") {
            return null;
        }

        try {
            return JSON.parse(jsonText);
        } catch (error) {
            console.error("Invalid stream JSON:", jsonText, error);
            return null;
        }
    }

    async function sendMessage() {
        const message = messageInput.value.trim();

        if (!message) return;

        if (isDictating) {
            stopDictation();
        }

        const selectedModel = modelSelect
            ? modelSelect.value
            : "google:gemini-3.5-flash";

        addMessage("user", message);

        messageInput.value = "";
        messageInput.style.height = "auto";

        sendBtn.disabled = true;
        statusText.textContent = `Thinking with ${selectedModel}...`;

        const likelyTool = detectLikelyTool(message);
        let toolProgress = null;

        if (likelyTool) {
            toolProgress = addToolProgress(likelyTool);
            statusText.textContent = `Using ${likelyTool}...`;
        }

        const botElement = addMessage("assistant", "");

        let firstTokenReceived = false;

        function handleStreamData(data) {
            if (!data) return;

            if (data.token !== undefined && data.token !== null) {
                if (!firstTokenReceived) {
                    firstTokenReceived = true;

                    if (likelyTool && toolProgress) {
                        completeToolProgress(toolProgress, likelyTool);
                    }

                    statusText.textContent = `Generating with ${selectedModel}...`;
                }

                botElement.textContent += data.token;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            if (data.error) {
                if (likelyTool && toolProgress) {
                    completeToolProgress(toolProgress, likelyTool);
                }

                botElement.textContent += "\n\nError: " + data.error;
                statusText.textContent = "Ready";
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }

            if (data.done) {
                if (likelyTool && toolProgress && !firstTokenReceived) {
                    completeToolProgress(toolProgress, likelyTool);
                }

                statusText.textContent = "Ready";
            }
        }

        try {
            const response = await fetch("/chat/stream", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message,
                    thread_id: threadId,
                    model: selectedModel
                })
            });

            if (!response.ok) {
                let errorText = "Request failed.";

                try {
                    const errorData = await response.json();
                    errorText = errorData.detail || errorData.message || errorText;
                } catch (error) {
                    console.error("Could not parse error response:", error);
                }

                botElement.textContent = errorText;
                return;
            }

            if (!response.body) {
                botElement.textContent = "Streaming is not supported by this browser.";
                return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder("utf-8");

            let buffer = "";

            while (true) {
                const { value, done } = await reader.read();

                if (done) {
                    break;
                }

                buffer += decoder.decode(value, { stream: true });

                const parts = buffer.split(/\r?\n\r?\n/);
                buffer = parts.pop() || "";

                for (const part of parts) {
                    const data = parseSSEPart(part);
                    handleStreamData(data);
                }
            }

            /*
                Important fix:
                Sometimes the final streamed response does not end with "\n\n".
                In that case, the final data remains inside buffer.
                This part makes sure the leftover buffer is also displayed.
            */
            buffer += decoder.decode();

            if (buffer.trim()) {
                const data = parseSSEPart(buffer);
                handleStreamData(data);
            }

        } catch (error) {
            console.error("Streaming error:", error);

            if (likelyTool && toolProgress) {
                completeToolProgress(toolProgress, likelyTool);
            }

            botElement.textContent = "Something went wrong: " + error.message;

        } finally {
            sendBtn.disabled = false;
            statusText.textContent = "Ready";
            messageInput.focus();

            await loadConversations();
        }
    }

    async function uploadFile() {
        const fileInput = document.getElementById("fileInput");

        if (!fileInput.files.length) {
            return;
        }

        const file = fileInput.files[0];

        addMessage("user", `📎 Uploaded document: ${file.name}`);

        const toolProgress = addToolProgress("Document Ingestion");
        statusText.textContent = "Using Document Ingestion...";

        const formData = new FormData();
        formData.append("file", file);
        formData.append("thread_id", threadId);

        try {
            const response = await fetch("/upload", {
                method: "POST",
                body: formData
            });

            const data = await response.json();

            completeToolProgress(toolProgress, "Document Ingestion");

            if (data.success) {
                addMessage(
                    "assistant",
                    data.message + "\n\nYou can now ask questions about this document."
                );

                await loadConversations();
            } else {
                addMessage("assistant", "Upload failed: " + data.message);
            }

        } catch (error) {
            completeToolProgress(toolProgress, "Document Ingestion");
            addMessage("assistant", "Upload failed: " + error.message);
        }

        statusText.textContent = "Ready";
        fileInput.value = "";
    }

    async function newChat() {
        threadId = crypto.randomUUID();
        localStorage.setItem("thread_id", threadId);

        if (isDictating) {
            stopDictation();
        }

        renderWelcome();
        await loadConversations();
        messageInput.focus();
    }

    loadConversations();
    renderWelcome();
    messageInput.focus();
</script>
